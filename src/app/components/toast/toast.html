@if (toasts.current(); as toast) {
  <!-- Success and warnings are announced politely; an error interrupts. -->
  <div class="toast toast--{{ toast.kind }}" [attr.role]="toast.kind === 'error' ? 'alert' : 'status'">
    <span class="toast__icon" aria-hidden="true">{{ toast.kind === 'success' ? '✓' : '!' }}</span>
    <div class="toast__body">
      <p class="toast__title">{{ toast.title }}</p>
      <p class="toast__message">{{ toast.message }}</p>
      @if (toast.action; as action) {
        <button class="toast__action" type="button" (click)="toasts.runAction()">{{ action.label }}</button>
      }
    </div>
    <button class="toast__close" type="button" aria-label="Luk besked" (click)="toasts.dismiss()">&times;</button>
  </div>
}
