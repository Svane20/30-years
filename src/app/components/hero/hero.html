<section
  class="hero"
  id="home"
  aria-label="Billeder af Kasper og Mette"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel()"
>
  <!-- Each polaroid stacks its photo from every slide; the current one fades in, rippling slot by slot. -->
  @for (slot of slots; track slot) {
    <button
      class="polaroid polaroid--{{ slot }}"
      type="button"
      [attr.aria-label]="'Vis billede i fuld skærm: ' + photoAt(slot).alt"
      (click)="open(slot, $event)"
    >
      @for (slide of invitation.slides; track $index; let i = $index) {
        <img
          [src]="slide[roleFor(slot, i)].src"
          [alt]="slide[roleFor(slot, i)].alt"
          [class.active]="i === current()"
          [attr.aria-hidden]="i !== current()"
          draggable="false"
        />
      }
    </button>
  }

  <div class="hero__title">
    <h1>Vi fylder<br />30!</h1>
    <p>{{ invitation.names }}</p>
  </div>

  <div class="hero__dots" aria-hidden="true">
    @for (slide of invitation.slides; track $index) {
      <span [class.active]="$index === current()"></span>
    }
  </div>
</section>

<!-- Outside the section, so taps in the lightbox never reach the slideshow's tap-to-advance handler. -->
@if (openPhoto(); as photo) {
  <app-lightbox [photo]="photo" (closed)="close()" />
}
