<section
  class="hero"
  id="home"
  aria-label="Billeder af Kasper og Mette"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel()"
>
  <!-- Each polaroid stacks its person's photo from every slide; the current one fades in, rippling slot by slot. -->
  @for (role of roles; track role; let slot = $index) {
    <figure class="polaroid polaroid--{{ slot }}">
      @for (slide of invitation.slides; track $index; let i = $index) {
        <img
          [src]="slide[role].src"
          [alt]="slide[role].alt"
          [class.active]="i === current()"
          [attr.aria-hidden]="i !== current()"
          draggable="false"
        />
      }
    </figure>
  }

  <div class="hero__title">
    <h1>Vi fylder<br />30!</h1>
    <p>{{ invitation.names }}</p>
  </div>

  <div class="hero__dots" aria-hidden="true">
    @for (slide of invitation.slides; track $index) {
      <span [class.active]="$index === current()"></span>
    }
  </div>
</section>
