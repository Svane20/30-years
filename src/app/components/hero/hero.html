<section
  class="hero"
  id="home"
  aria-label="Billeder af Kasper og Mette"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel()"
>
  <!-- Tracked by photo: a new photo creates a new polaroid (which fades in); photos that only change slot glide there. -->
  @for (photoIndex of state().slots; track photoIndex; let slot = $index) {
    <figure class="polaroid polaroid--{{ slot }}">
      <img [src]="invitation.photos[photoIndex].src" [alt]="invitation.photos[photoIndex].alt" draggable="false" />
    </figure>
  }

  <div class="hero__title">
    <h1>Vi fylder<br />30!</h1>
    <p>{{ invitation.names }}</p>
  </div>

  <div class="hero__dots" aria-hidden="true">
    @for (photo of invitation.photos; track photo.src) {
      <span [class.active]="$index === state().current"></span>
    }
  </div>
</section>
